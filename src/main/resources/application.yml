spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

  Jackson:
    time-zone: UTC

jwt:
  private-key: ${JWT_PRIVATE_KEY:file:./secrets/private.pem}
  public-key: ${JWT_PUBLIC_KEY:file:./secrets/public.pem}
  access-token-ttl: 15m

refresh-token:
  ttl: 30d