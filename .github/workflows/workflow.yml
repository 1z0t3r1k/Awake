name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Build Docker image
        run: docker build -t am-i-awake-backend:ci .

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/am-i-awake-backend"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          docker tag am-i-awake-backend:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          IMAGE="ghcr.io/1z0t3r1k/am-i-awake-backend:${{ github.sha }}"

          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "
            cd /opt/am-i-awake &&
            sed -i 's|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$IMAGE|' .env.prod &&
            docker compose --env-file .env.prod -f compose.prod.yaml pull backend &&
            docker compose --env-file .env.prod -f compose.prod.yaml up -d backend
          "